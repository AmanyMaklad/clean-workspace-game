<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>لعبة نظّف مساحة عملي</title>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#eef7f4;color:#17324d}
.wrap{max-width:1200px;margin:auto;padding:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:15px;flex-wrap:wrap}
h1{margin:0;background:#4b9a54;color:white;padding:12px 28px;border-radius:22px;font-size:clamp(24px,4vw,46px)}
.instructions{font-size:clamp(16px,2vw,25px);font-weight:700;margin:12px 0}
.status{display:flex;gap:12px;align-items:center;font-weight:bold;font-size:20px}
button.reset,.again{border:0;background:#fff2c8;color:#9a571b;border:2px solid #e6b849;border-radius:14px;padding:10px 16px;font-weight:bold;font-size:17px;cursor:pointer}
.game{position:relative;aspect-ratio:16/9;border-radius:25px;overflow:hidden;border:4px solid #d9b27a;background:linear-gradient(#dff2f5 0 18%,#dba16d 18% 100%)}
.desk{position:absolute;inset:18% 2% 2%;background:linear-gradient(155deg,#e6b27c,#c98955);border-radius:22px}
.monitor{position:absolute;left:31%;top:9%;width:38%;height:31%;background:#344654;border:8px solid #263640;border-radius:12px}
.screen{position:absolute;inset:5%;background:linear-gradient(150deg,#42b8e4,#0874b9);border-radius:4px}
.stand{position:absolute;left:47%;top:39%;width:6%;height:10%;background:#40515e}.stand:after{content:"";position:absolute;left:-50%;bottom:-5px;width:200%;height:10px;background:#40515e;border-radius:8px}
.keyboard{position:absolute;left:31%;top:53%;width:38%;height:16%;background:#eef2f3;border:4px solid #89979e;border-radius:9px;display:grid;grid-template-columns:repeat(12,1fr);gap:3px;padding:6px}
.key{background:white;border:1px solid #aeb9bd;border-radius:2px}
.mouse{position:absolute;left:70%;top:52%;width:9%;height:15%;z-index:3;overflow:visible}
.item,.allowed{position:absolute;border:0;background:transparent;padding:0;cursor:pointer;transition:.3s;z-index:5}
.item:hover,.allowed:hover{transform:scale(1.08)} .item.gone{opacity:0;transform:scale(.1);pointer-events:none}
.item svg{width:100%;height:100%;filter:drop-shadow(0 3px 2px #0003)}
.cup{left:7%;top:39%;width:12%;height:25%}.burger{right:6%;top:34%;width:17%;height:21%}.papers{left:7%;bottom:7%;width:15%;height:19%}.pens{right:8%;bottom:7%;width:14%;height:17%}.paint{left:20%;bottom:4%;width:16%;height:18%}.juice{left:21%;top:43%;width:8%;height:20%}.tissue{left:20%;top:27%;width:9%;height:12%}.choc{right:20%;bottom:9%;width:9%;height:14%}
.safe{position:absolute;z-index:8;border:0;background:transparent;cursor:pointer}.safe.monitorhit{left:30%;top:8%;width:40%;height:34%}.safe.keyboardhit{left:30%;top:51%;width:40%;height:20%}.safe.mousehit{left:69%;top:51%;width:12%;height:18%}
.feedback{min-height:50px;text-align:center;font-size:22px;font-weight:bold;padding:10px}
.nahool{position:absolute;right:2%;top:3%;z-index:20;display:none;align-items:center;gap:8px;background:white;border:4px solid #55a564;border-radius:20px;padding:10px;max-width:290px}
.nahool.show{display:flex}.nahool.bad{border-color:#d84c4c;color:#c62828;background:#fff1f1}.bee{font-size:55px}.bubble{font-weight:bold;font-size:18px;line-height:1.45}
.win{position:absolute;z-index:30;inset:20% 20%;display:none;flex-direction:column;justify-content:center;align-items:center;text-align:center;background:#fffffff5;border:6px solid #55a564;border-radius:28px;font-size:clamp(25px,4vw,45px);font-weight:bold}.win.show{display:flex}.win small{font-size:.55em;margin:8px}
@media(max-width:600px){.wrap{padding:8px}.game{min-height:320px}.nahool{max-width:45%;padding:6px}.bee{font-size:35px}.bubble{font-size:13px}.win{inset:15% 8%}}
.school-credit{
  text-align:center;
  direction:rtl;
  font-size:14px;
  font-weight:700;
  color:#49635c;
  padding:12px 8px 4px;
}
</style>
</head>
<body>
<div class="wrap">
<header>
<h1>نظّف مساحة عملي</h1>
<div class="status"><span id="score">0 / 6</span><button class="reset" id="soundToggle">🔊 الصوت</button><button class="reset" id="reset">↻ إعادة اللعبة</button></div>
</header>
<div class="instructions">اضغط على الأشياء التي لا يجب أن تكون بجوار الحاسوب.</div>
<div id="feedback" class="feedback">ساعد سعد في جعل مساحة العمل نظيفة وآمنة.</div>

<div class="game">
<div class="desk"></div>
<div class="monitor"><div class="screen"></div></div><div class="stand"></div>
<div id="keyboard" class="keyboard"></div>
<svg class="mouse" viewBox="0 0 110 145" role="img" aria-label="فأرة الحاسوب">
  <path d="M55 7 C24 7 12 32 12 75 C12 116 27 137 55 137 C83 137 98 116 98 75 C98 32 86 7 55 7Z"
        fill="#f7f9fa" stroke="#56656d" stroke-width="6"/>
  <path d="M55 10 V64" stroke="#56656d" stroke-width="5"/>
  <path d="M16 64 H94" stroke="#9aa6ac" stroke-width="3"/>
  <rect x="48" y="27" width="14" height="27" rx="7" fill="#6d7c83"/>
  <path d="M55 137 C55 143 70 145 83 145" fill="none" stroke="#56656d" stroke-width="5" stroke-linecap="round"/>
</svg>

<button class="item cup" aria-label="شراب">
<svg viewBox="0 0 120 150" role="img" aria-label="زجاجة ماء وكوب">
  <rect x="19" y="24" width="48" height="108" rx="15" fill="#8edcf1" stroke="#247c9d" stroke-width="5"/>
  <rect x="30" y="8" width="26" height="22" rx="5" fill="#3f9fc0" stroke="#247c9d" stroke-width="4"/>
  <path d="M25 60 H61 M25 92 H61" stroke="#e9fbff" stroke-width="5" opacity=".9"/>
  <path d="M76 67 H108 L103 132 H81Z" fill="#dff7ff" stroke="#438ba5" stroke-width="5"/>
  <path d="M80 92 H105 L102 128 H83Z" fill="#65cbea" opacity=".85"/>
  <ellipse cx="92" cy="67" rx="16" ry="5" fill="#f4fdff" stroke="#438ba5" stroke-width="4"/>
</svg></button>
<button class="item burger" aria-label="طعام">
<svg viewBox="0 0 170 120" role="img" aria-label="طعام">
  <ellipse cx="83" cy="91" rx="70" ry="21" fill="#f6fbfc" stroke="#8fa7ad" stroke-width="4"/>
  <path d="M24 64 Q72 20 119 63 L112 75 H32Z" fill="#efbd68" stroke="#a96c2f" stroke-width="5"/>
  <path d="M31 76 H115 L106 87 H39Z" fill="#69ad61"/>
  <path d="M39 87 H108 L99 98 H48Z" fill="#f2d052"/>
  <path d="M49 99 H99" stroke="#a9622d" stroke-width="10" stroke-linecap="round"/>
  <circle cx="133" cy="54" r="22" fill="#e6534f" stroke="#a92f32" stroke-width="4"/>
  <path d="M133 31 Q132 18 142 13" fill="none" stroke="#5d713b" stroke-width="5" stroke-linecap="round"/>
  <path d="M139 27 Q153 19 157 30 Q146 36 139 27Z" fill="#67a653"/>
</svg></button>
<button class="allowed papers" aria-label="أوراق"><svg viewBox="0 0 150 110"><rect x="18" y="20" width="90" height="67" fill="#e9f2e7" stroke="#789778" stroke-width="4" transform="rotate(-11 60 53)"/><rect x="39" y="28" width="91" height="68" fill="white" stroke="#89969c" stroke-width="4" transform="rotate(8 84 62)"/><path d="M54 48H110M54 61H116M54 74H98" stroke="#aeb7bb" stroke-width="4"/></svg></button>
<button class="allowed pens" aria-label="أقلام"><svg viewBox="0 0 150 100"><g transform="rotate(-15 75 50)"><rect x="15" y="35" width="105" height="15" rx="4" fill="#e95763"/><polygon points="120,35 142,42 120,50" fill="#e7b98f"/></g><g transform="rotate(23 75 55)"><rect x="28" y="58" width="90" height="15" rx="4" fill="#4eaa71"/><polygon points="118,58 138,65 118,73" fill="#e7b98f"/></g></svg></button>
<button class="item paint" aria-label="ألوان مبعثرة ومنسكبة"><svg viewBox="0 0 180 120">
<ellipse cx="88" cy="92" rx="52" ry="15" fill="#4ea8de"/><ellipse cx="128" cy="97" rx="25" ry="9" fill="#ef476f"/>
<g transform="rotate(-22 65 50)"><rect x="27" y="34" width="77" height="25" rx="7" fill="#f6c945" stroke="#8a7130" stroke-width="4"/><rect x="87" y="34" width="17" height="25" fill="#e84a5f"/></g>
<g transform="rotate(24 116 50)"><rect x="81" y="29" width="74" height="25" rx="7" fill="#66c56c" stroke="#46784a" stroke-width="4"/><rect x="138" y="29" width="17" height="25" fill="#8f5bd5"/></g>
<circle cx="43" cy="88" r="8" fill="#f6c945"/><circle cx="154" cy="84" r="7" fill="#8f5bd5"/></svg></button><button class="item juice" aria-label="علبة عصير"><svg viewBox="0 0 110 145"><path d="M25 35 L43 14 H79 L91 35 V129 H25Z" fill="#f7b54a" stroke="#9b6728" stroke-width="5"/><path d="M43 14 L55 35 H91 L79 14Z" fill="#ffd477" stroke="#9b6728" stroke-width="4"/><rect x="37" y="57" width="42" height="48" rx="6" fill="#fff5d8"/><circle cx="58" cy="78" r="13" fill="#f07c45"/><path d="M69 27 L89 3" stroke="#e65a67" stroke-width="6"/></svg></button><button class="item tissue" aria-label="منديل"><svg viewBox="0 0 100 80"><path d="M16 51Q23 20 46 31Q58 6 72 31Q95 27 84 61Q62 69 44 60Q27 73 16 51Z" fill="white" stroke="#cbd4d8" stroke-width="4"/></svg></button>
<button class="item choc" aria-label="شوكولاتة"><svg viewBox="0 0 110 100"><rect x="25" y="15" width="65" height="70" rx="5" fill="#d73f5a"/><rect x="33" y="7" width="49" height="32" fill="#75442e"/><path d="M49 7V39M66 7V39M33 23H82" stroke="#a86a4b" stroke-width="3"/></svg></button>

<button class="safe monitorhit" aria-label="شاشة الحاسوب"></button>
<button class="safe keyboardhit" aria-label="لوحة المفاتيح"></button>
<button class="safe mousehit" aria-label="الفأرة"></button>

<div id="nahool" class="nahool"><div class="bee">🐝</div><div id="bubble" class="bubble"></div></div>
<div id="win" class="win">⭐ أحسنت! ⭐<small>أصبحت مساحة عملي نظيفة وآمنة.</small><button id="again" class="again">العب مرة أخرى</button></div>
</div>
</div>
<div class="school-credit">قسم الحوسبة وتكنولوجيا المعلومات – مدرسة الوكير النموذجية للبنين | 2026–2027</div>
<script>

let audioCtx=null, soundOn=true;
function ctx(){
  if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended') audioCtx.resume();
  return audioCtx;
}
function beep(freq, delay, duration, volume, type='sine'){
  if(!soundOn) return;
  const c=ctx(), o=c.createOscillator(), g=c.createGain();
  o.type=type;
  o.frequency.setValueAtTime(freq,c.currentTime+delay);
  g.gain.setValueAtTime(volume,c.currentTime+delay);
  g.gain.exponentialRampToValueAtTime(0.001,c.currentTime+delay+duration);
  o.connect(g); g.connect(c.destination);
  o.start(c.currentTime+delay); o.stop(c.currentTime+delay+duration+.03);
}
function correctSound(){
  beep(660,0,.16,.22,'sine');
  beep(880,.13,.22,.22,'sine');
}
function wrongSound(){
  beep(220,0,.20,.18,'square');
  beep(165,.18,.28,.16,'square');
}
function winSound(){
  beep(523,0,.15,.20); beep(659,.12,.15,.20);
  beep(784,.24,.15,.20); beep(1047,.37,.38,.22);
}

document.addEventListener('pointerdown',()=>{if(soundOn)ctx();},{once:true});
const kb=document.getElementById('keyboard');for(let i=0;i<48;i++){let k=document.createElement('span');k.className='key';kb.appendChild(k)}
const items=[...document.querySelectorAll('.item')],safe=[...document.querySelectorAll('.safe')],score=document.getElementById('score'),feedback=document.getElementById('feedback'),nahool=document.getElementById('nahool'),bubble=document.getElementById('bubble'),win=document.getElementById('win');let n=0,t;
function say(txt,bad=false){clearTimeout(t);bubble.textContent=txt;nahool.classList.toggle('bad',bad);nahool.classList.add('show');t=setTimeout(()=>nahool.classList.remove('show'),1900)}
function update(){score.textContent=n+' / '+items.length;if(n===items.length){feedback.textContent='';setTimeout(()=>{win.classList.add('show');winSound()},300)}else{feedback.textContent='ساعد سعد في جعل مساحة العمل نظيفة وآمنة.'}}
items.forEach(x=>x.onclick=()=>{if(x.classList.contains('gone'))return;x.classList.add('gone');n++;correctSound();say('أحسنت! هذا لا يجب أن يكون بجوار الحاسوب. ✓');update()})
const allowed=[...document.querySelectorAll('.allowed')];
allowed.forEach(x=>x.onclick=()=>{correctSound();say('يمكن أن يبقى الدفتر والقلم على المكتب إذا كانا مرتبين.');feedback.textContent='ساعد سعد في جعل مساحة العمل نظيفة وآمنة.'});
safe.forEach(x=>x.onclick=()=>{wrongSound();say('لا! هذا جزء من الحاسوب ويجب أن يبقى.',true);feedback.textContent='ساعد سعد في جعل مساحة العمل نظيفة وآمنة.'})
function reset(){n=0;items.forEach(x=>x.classList.remove('gone'));win.classList.remove('show');nahool.classList.remove('show');feedback.textContent='ساعد سعد في جعل مساحة العمل نظيفة وآمنة.';update()}
document.getElementById('soundToggle').onclick=()=>{soundOn=!soundOn;document.getElementById('soundToggle').textContent=soundOn?'🔊 الصوت':'🔇 الصوت';if(soundOn)correctSound()};
document.getElementById('reset').onclick=reset;document.getElementById('again').onclick=reset;update();
</script>
</body>
</html>
